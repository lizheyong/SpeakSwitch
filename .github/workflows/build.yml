name: Build SpeakSwitch macOS app

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test Fn routing
        run: ./scripts/test.sh
      - name: Build Swift package
        run: swift build
      - name: Package macOS app
        run: ./scripts/build-app.sh
      - name: Upload app archive
        uses: actions/upload-artifact@v4
        with:
          name: SpeakSwitch-macOS-unsigned
          path: dist/SpeakSwitch-*.zip
          if-no-files-found: error
